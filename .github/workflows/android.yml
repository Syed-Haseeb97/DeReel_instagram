name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "DEBUG_KEYSTORE_BASE64 is unavailable (for example, on a forked PR); using the default debug keystore."
            exit 0
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > app/ci-debug.keystore

      - name: Run unit tests, debug build, and lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeReel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
